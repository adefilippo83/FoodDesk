# FoodDesk behind nginx on port 80: waiters just type the server's IP or
# hostname, no port number. Install as
#   /etc/nginx/sites-available/fooddesk  (symlink into sites-enabled)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # PDFs are small; orders are tiny. Keep the limit low.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
