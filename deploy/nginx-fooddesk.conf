# FoodDesk behind nginx on port 80: waiters just type the server's IP or
# hostname, no port number. Install as
#   /etc/nginx/sites-available/fooddesk  (symlink into sites-enabled)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Settings image uploads travel as base64 JSON (~2 MB worst case); the
    # app enforces its own tighter per-route limits behind this.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-sent events: no buffering, and the stream stays open for hours.
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
