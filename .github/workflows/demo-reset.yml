name: Demo reset

# Restores the public demo (https://fooddesk.fly.dev) to its canonical fake
# dataset every 6 hours — and on demand from the Actions tab.
#
# The app resets itself: POST /api/demo/reset (enabled by the DEMO_RESET_TOKEN
# secret on the Fly app, same value as the repository secret below) reloads
# the demo evening in-process, in one transaction. The previous approach —
# SSH into the machine and start a second Node process to run the seed —
# needed a Fly API tunnel and an SSH dial that both failed at times, and on a
# 256 MB machine the extra process got the live server OOM-killed.
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One reset at a time; a slow one must never pile up behind the next.
concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    name: Reset demo data
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reseed the demo dataset
        # The machine auto-stops when idle and the first request wakes it,
        # which takes a few seconds. The reset is one transaction, so a
        # request that failed or timed out midway is safe to retry.
        run: |
          if [ -z "$DEMO_RESET_TOKEN" ]; then
            echo "::error::DEMO_RESET_TOKEN repository secret is not set"; exit 1
          fi
          curl -sS -f -m 90 --retry 6 --retry-delay 10 --retry-all-errors \
            -X POST -H "Authorization: Bearer $DEMO_RESET_TOKEN" \
            https://fooddesk.fly.dev/api/demo/reset
          echo
        env:
          DEMO_RESET_TOKEN: ${{ secrets.DEMO_RESET_TOKEN }}
