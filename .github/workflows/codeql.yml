name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly sweep even when nothing is pushed — new queries land upstream.
    - cron: '30 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.4
        with:
          languages: javascript-typescript
          # The security-extended pack digs deeper than the default suite.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4.37.4
        with:
          category: '/language:javascript-typescript'
