name: Docker

# Builds the container image on every PR (validation only) and publishes it
# to GitHub Container Registry on main and tags:
#   ghcr.io/adefilippo83/fooddesk:edge     — every push to main
#   ghcr.io/adefilippo83/fooddesk:latest   — every v* tag
#   ghcr.io/adefilippo83/fooddesk:X.Y.Z    — the tag's version

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # arm64 build runs under emulation — needed for Raspberry-class boxes.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # PRs build amd64 only (fast validation, no push); main and tags build
      # and publish the full multi-arch image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
