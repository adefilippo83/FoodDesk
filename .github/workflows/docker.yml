name: Docker

# Builds the container image on every PR (validation only) and publishes it
# to GitHub Container Registry on main and tags:
#   ghcr.io/adefilippo83/fooddesk:edge     — every push to main
#   ghcr.io/adefilippo83/fooddesk:latest   — every v* tag
#   ghcr.io/adefilippo83/fooddesk:X.Y.Z    — the tag's version

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # arm64 build runs under emulation — needed for Raspberry-class boxes.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Build once for the runner's own architecture and load it locally, so
      # the image can actually be booted — not just compiled.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fooddesk:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must boot, migrate, seed and serve a login — every PR.
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e ADMIN_PASSWORD=smoke-test-pass1 fooddesk:smoke
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::server never became healthy"; docker logs smoke; exit 1
          fi
          curl -sf -X POST http://127.0.0.1:3000/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"smoke-test-pass1"}' \
            | grep -q '"role":"admin"' \
            || { echo "::error::admin login failed"; docker logs smoke; exit 1; }
          echo "image boots, migrates, seeds and serves logins"
          docker rm -f smoke

      # Publish the full multi-arch image — main and tags only. The amd64
      # half comes straight from the cache warmed above.
      - uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Public demo at https://fooddesk.fly.dev — follows main automatically,
  # but only after the image passed its smoke test.
  demo:
    name: Deploy demo (Fly.io)
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
