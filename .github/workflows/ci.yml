name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

# A newer push to the same branch/PR supersedes the running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 (Active LTS) is what the Debian venue server runs; 26 is the canary.
        node: [24, 26]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suites
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build web + server
        run: npm run build

      # The exact bits a release would ship: server/dist + the built PWA.
      - name: Upload build artifact
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: fooddesk-build
          path: |
            server/dist
            server/public
          retention-days: 7

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build web + server
        run: npm run build

      # Login → menu → order → kitchen display against the production build.
      - name: Run smoke test
        run: npm run test:e2e
