name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR supersedes the running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 (Active LTS) is what the Debian venue server runs; 26 is the canary.
        node: [24, 26]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suites
        run: npm test

      - name: Build web + server
        run: npm run build

      # The exact bits a release would ship: server/dist + the built PWA.
      - name: Upload build artifact
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: fooddesk-build
          path: |
            server/dist
            server/public
          retention-days: 7
