# Known connectivity-check hostnames get their own server so the answer is
# right regardless of path; everything else the DNS catch-all redirects here
# falls through to the default (FoodDesk) server, whose probe snippet covers
# the well-known paths. Installed as /etc/nginx/sites-available/fooddesk-probes.
server {
    listen 80;
    listen [::]:80;
    server_name
        connectivitycheck.gstatic.com
        connectivitycheck.android.com
        clients3.google.com
        clients4.google.com
        android.clients.google.com
        play.googleapis.com
        captive.apple.com
        gsp1.apple.com
        www.appleiphonecell.com
        www.itools.info
        www.ibook.info
        www.airport.us
        www.thinkdifferent.us
        www.msftconnecttest.com
        msftconnecttest.com
        www.msftncsi.com
        msftncsi.com
        detectportal.firefox.com
        connectivity-check.ubuntu.com
        nmcheck.gnome.org
        network-test.debian.org
        connect.rom.miui.com
        wifi.vivo.com.cn
        conn1.oppomobile.com
        conn2.oppomobile.com
        connectivitycheck.platform.hicloud.com
        captiveportal.kuketz.de
        ;

    include snippets/fooddesk-probes.conf;

    # Ubuntu/NetworkManager checks the header; Android-family default is an
    # empty 204 for any path on its probe hosts.
    location / {
        add_header X-NetworkManager-Status online;
        return 204;
    }
}
