# OS connectivity-check probes, answered exactly as each vendor expects, so
# devices on the FoodDesk access point consider themselves online even when
# the venue has no internet. Path-based (host-independent) so OEM variants
# that use their own domains but the same paths are covered too. Included in
# both the probe-hostname server and the main FoodDesk server (the DNS
# catch-all sends unknown probe domains to the default server).

# Android and derivatives: expect an empty 204.
location = /generate_204 { return 204; }
location = /gen_204 { return 204; }
location = /generate204 { return 204; }
location = /mobile/status.php { return 204; }

# Apple (iOS/macOS): expect this exact Success page.
location = /hotspot-detect.html {
    default_type text/html;
    return 200 "<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>";
}
location = /library/test/success.html {
    default_type text/html;
    return 200 "<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>";
}

# Windows NCSI.
location = /connecttest.txt {
    default_type text/plain;
    return 200 "Microsoft Connect Test";
}
location = /ncsi.txt {
    default_type text/plain;
    return 200 "Microsoft NCSI";
}

# Firefox portal detection, and misc "success" probes.
location = /success.txt {
    default_type text/plain;
    return 200 "success";
}
location = /check_network_status.txt {
    default_type text/plain;
    return 200 "success";
}

# NetworkManager (Fedora/GNOME-style check).
location = /nm-check.txt {
    default_type text/plain;
    return 200 "NetworkManager is online";
}
